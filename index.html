<!DOCTYPE html>
<html>
<head>
    <title>Warehouse Map</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        
        #map-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border: 2px solid #333;
            margin-top: 20px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* All interactive elements */
        path, rect {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Hover effect so you know what is clickable */
        path:hover, rect:hover {
            fill-opacity: 0.7;
            stroke: #000;
            stroke-width: 2px;
        }

        .highlight-active {
            fill: rgba(0, 255, 0, 0.5) !important; 
            stroke: #006400 !important;
            stroke-width: 5px !important;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Warehouse Map</h1>
    
    <div style="margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="Enter ID (e.g. RW-PR01)..." 
               style="padding: 10px; font-size: 16px; width: 300px;">
        <button onclick="searchMap()" style="padding: 10px 20px; font-size: 16px;">Find</button>
        <button onclick="clearMap()" style="padding: 10px 20px; font-size: 16px;">Clear</button>
        <button onclick="updateMapLinks()" style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">🔄 Update Map Links</button>
        <div id="status" style="margin-top: 10px; font-weight: bold; min-height: 24px;"></div>
        <div id="updateStatus" style="margin-top: 10px; padding: 10px; border-radius: 4px; display: none; min-height: 24px;"></div>
    </div>

    <div id="map-container"></div>

    <script>
        window.onload = function() {
            fetch('warehouse.svg')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('map-container').innerHTML = data;
                    setupClickListeners();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const targetId = urlParams.get('target');
                    if (targetId) {
                        document.getElementById('searchInput').value = targetId;
                        searchMap();
                    }
                })
                .catch(error => {
                    setStatus("Error: Could not find warehouse.svg", "red");
                });
        };

        function setupClickListeners() {
            const svg = document.querySelector('svg');
            // Listen for clicks on any rectangle or path with an ID
            svg.addEventListener('click', function(e) {
                const target = e.target.closest('rect, path');
                if (target && target.id) {
                    const id = target.id;
                    const markdownLink = "[WAREHOUSE LOCATION MAP](https://map.jkbeachum.com/?target=" + id + ")";
                    
                    // 1. Copy to Clipboard
                    navigator.clipboard.writeText(markdownLink).then(() => {
                        // 2. Highlight it visually
                        document.getElementById('searchInput').value = id;
                        searchMap();
                        // 3. Update Status
                        setStatus("Copied Markdown for: " + id, "blue");
                    });
                }
            });
        }

        function searchMap() {
            let query = document.getElementById('searchInput').value.trim();
            document.querySelectorAll('.highlight-active').forEach(el => el.classList.remove('highlight-active'));

            if (!query) return;

            let target = document.getElementById(query);
            if (target) {
                target.classList.add('highlight-active');
                setStatus("Viewing: " + query, "green");
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                setStatus("ID '" + query + "' not found on map.", "red");
            }
        }

        function setStatus(text, color) {
            const status = document.getElementById('status');
            status.innerText = text;
            status.style.color = color;
        }

        function clearMap() {
            document.getElementById('searchInput').value = '';
            document.getElementById('status').innerText = '';
            document.querySelectorAll('.highlight-active').forEach(el => el.classList.remove('highlight-active'));
            window.history.pushState({}, document.title, window.location.pathname);
        }

        function updateMapLinks() {
            const updateStatusDiv = document.getElementById('updateStatus');
            updateStatusDiv.style.display = 'block';
            updateStatusDiv.style.backgroundColor = '#fff3cd';
            updateStatusDiv.style.color = '#856404';
            updateStatusDiv.innerText = '⏳ Running map update... This may take a moment...';
            
            // Get your Home Assistant long-lived access token from settings
            const haToken = localStorage.getItem('ha_token') || prompt('Enter your Home Assistant Long-Lived Token (get from: Settings → Create Token)');
            if (!haToken) {
                updateStatusDiv.style.backgroundColor = '#f8d7da';
                updateStatusDiv.style.color = '#721c24';
                updateStatusDiv.innerText = '✗ Error: No Home Assistant token provided';
                return;
            }
            
            // Save token for next time
            localStorage.setItem('ha_token', haToken);
            
            // Call Home Assistant shell command via service
            fetch('http://localhost:8123/api/services/shell_command/update_warehouse_map', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${haToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            })
            .then(response => {
                if (response.status === 401) {
                    throw new Error('Invalid token - please check your Home Assistant token');
                }
                return response.json();
            })
            .then(data => {
                updateStatusDiv.style.backgroundColor = '#d4edda';
                updateStatusDiv.style.color = '#155724';
                updateStatusDiv.innerText = '✓ Success! Warehouse map links updated. Items in Homebox have been updated with location map links.';
            })
            .catch(error => {
                updateStatusDiv.style.backgroundColor = '#f8d7da';
                updateStatusDiv.style.color = '#721c24';
                updateStatusDiv.innerText = `✗ Error: ${error.message}`;
            });
        }
    </script>

</body>
</html>
